[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "scintilla-py"
dynamic = ["version"]
description = "Single-Cell INTegrated Inference, Labelling, and Landscape Analysis: cell-type label quality and method benchmarking for scRNA-seq"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "S. Kanannejad" },
    { name = "N. Bongiorni" },
    { name = "E. Nordera" },
    { name = "S. Redaelli" },
    { name = "I. Rusconi" },
    { name = "R. Zanin" },
    { name = "A. Giustacchini" },
    { name = "Soumick Chatterjee" },
]
maintainers = [
    { name = "Soumick Chatterjee" },
]
keywords = [
    "single-cell",
    "scrna-seq",
    "scverse",
    "anndata",
    "scanpy",
    "cell-type annotation",
    "label quality",
    "benchmarking",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "anndata>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Individual feature groups.
stats = [
    "scikit-posthocs>=0.9",
]
viz = [
    "plotly>=5.18",
]
# Everything that makes more methods available. Kept as a single switch
# because the benchmarks adapt to whichever backends are installed.
full = [
    "scintilla-py[stats,viz]",
    "shap",
    "mudata>=0.2",
    "leidenalg",
    "louvain>=0.8.2",
    # Louvain imports pkg_resources, removed from setuptools 82.
    "setuptools<82",
    "python-igraph",
    "harmonypy",
    "bbknn",
    "scanorama",
    "hdbscan",
    "xgboost",
    "lightgbm",
    "Boruta",
    "mrmr-selection",
    "umap-learn",
    "psutil",
    "kneed",
]
test = [
    "pytest>=8",
    "pytest-cov",
    "scintilla-py[stats,viz]",
]
doc = [
    "sphinx>=7",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme>=1",
    "sphinx-copybutton",
    "sphinxcontrib-bibtex>=2",
    "myst-nb>=1",
    "ipykernel",
]

[project.scripts]
scintilla = "scintilla.cli.main:main"

[project.urls]
Homepage = "https://github.com/soumickmj/scINTILLA"
Documentation = "https://scintilla-py.readthedocs.io/"
Source = "https://github.com/soumickmj/scINTILLA"
Issues = "https://github.com/soumickmj/scINTILLA/issues"
Changelog = "https://github.com/soumickmj/scINTILLA/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.9", "twine>=6", "build"]

[tool.hatch.version]
path = "src/scintilla/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scintilla"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/GUIDE.md",
    "/LABEL_QUALITY_VARIANTS.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not slow"]
markers = [
    "slow: long-running benchmark sweeps (deselected by default; run with -m slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
source = ["scintilla"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle errors that are not formatting
    "F",                # pyflakes
    "B",                # flake8-bugbear
    "UP",               # pyupgrade
    "I",                # isort
]
ignore = [
    "B008",  # function call in default argument (argparse/typer style)
    "B905",  # zip without strict=
    "E741",  # ambiguous variable name (X, l are conventional in numerical code)
    "UP007", "UP045",  # keep Optional[...]/Union[...] where they already exist
    "UP006", "UP035",  # keep typing.List/Dict where they already exist
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
