name: Check build

on:
  workflow_dispatch:
  push:
    branches: [master, main, scverse]  # scverse: the pre-merge branch; drop after merging
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import scintilla; print(scintilla.__version__)"
          /tmp/smoke/bin/scintilla --help
