name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 5 * * 1"  # weekly, to catch breakage from new upstream releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest versions the package claims to support, with only the minimal dependencies.
          - { python: "3.11", resolution: lowest-direct, extras: "test" }
          # The newest versions, with every optional backend installed.
          - { python: "3.13", resolution: highest, extras: "test,full" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        # uv pip (not uv sync) resolves only the requested extras: lowest-direct on the whole
        # project would also pull ancient versions of the unbounded optional backends.
        run: |
          uv venv
          uv pip install --resolution ${{ matrix.resolution }} -e ".[${{ matrix.extras }}]"
      - name: Test
        run: uv run --no-sync pytest --cov --cov-report=xml
      - name: Upload coverage
        if: matrix.resolution == 'highest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  slow:
    name: slow benchmark sweeps
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: |
          uv venv
          uv pip install -e ".[test,full]"
      - run: uv run --no-sync pytest -m slow

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
