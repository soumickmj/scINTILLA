name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scintilla-py
    permissions:
      id-token: write  # PyPI trusted publishing, no API token stored in secrets
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
