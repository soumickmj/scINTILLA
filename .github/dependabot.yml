version: 2
updates:
  # Python dependencies (uv.lock and pyproject.toml): one grouped pull request per week.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # The lower bounds are API requirements checked by the oldest-versions CI job, not pins.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
